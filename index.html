    <main class="app-shell">
      <section class="hero">

            <select id="voiceSelect">
              <option value="en-US-EmmaNeural">Emma - English (US)</option>
              <option value="en-US-JennyNeural">Jenny - English (US)</option>
              <option value="en-US-GuyNeural">Guy - English (US)</option>
              <option value="zh-TW-HsiaoChenNeural">&#26313;&#33275; - &#20013;&#25991; (&#21488;&#28771;)</option>
              <option value="zh-TW-YunJheNeural">&#38642;&#21746; - &#20013;&#25991; (&#21488;&#28771;)</option>
              <option value="ja-JP-NanamiNeural">Nanami - Japanese</option>

          </div>

          <div class="field">
            <label for="rateSelect">&#35486;&#36895;</label>
            <select id="rateSelect">
              <option value="-30%">&#38750;&#24120;&#24930; (-30%)</option>
              <option value="-20%">&#36611;&#24930; (-20%)</option>
              <option value="-15%">&#24930; (-15%)</option>

              <option value="+0%">&#27491;&#24120; (0%)</option>
              <option value="+5%">&#31245;&#24555; (+5%)</option>
              <option value="+10%">&#36611;&#24555; (+10%)</option>
            </select>
          </div>

          <div class="field">
            <label for="fileName">MP3 &#27284;&#21517;</label>
            <input id="fileName" type="text" value="speech.mp3" autocomplete="off">
          </div>

          <div class="actions">
            <button class="primary-button" id="generateButton" type="button">&#29986;&#29983; MP3</button>
            <button class="secondary-button" id="previewButton" type="button">&#35430;&#32893;&#35486;&#38899;</button>
            <button class="ghost-button" id="stopButton" type="button">&#20572;&#27490;&#35430;&#32893;</button>
          </div>

          <div class="note">

            <p>MP3 &#29986;&#29983;&#21644;&#35430;&#32893;&#26371;&#20778;&#20808;&#20351;&#29992; Microsoft Edge Read Aloud &#35486;&#38899;&#26381;&#21209;&#12290;&#33509;&#28687;&#35261;&#22120;&#28961;&#27861;&#36899;&#32218;&#65292;&#35430;&#32893;&#26371;&#25913;&#29992;&#28687;&#35261;&#22120;&#20839;&#24314;&#35486;&#38899;&#12290;</p>

        </div>
